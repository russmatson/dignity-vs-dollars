<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Lower My Dignity to Increase My Bank Account</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d0d;
    color: #f0e6d3;
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    background-image: radial-gradient(ellipse at top, #1a0a2e 0%, #0d0d0d 70%);
  }

  h1 {
    font-family: 'Bangers', cursive;
    font-size: clamp(1.5rem, 4vw, 2.8rem);
    text-align: center;
    color: #ffd700;
    text-shadow: 3px 3px 0 #8b0000, -1px -1px 0 #8b0000;
    letter-spacing: 2px;
    margin-bottom: 8px;
    line-height: 1.1;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 16px;
    text-align: center;
    font-style: italic;
  }

  .stats-bar {
    display: flex;
    gap: 16px;
    width: 100%;
    max-width: 700px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .stat-box {
    flex: 1;
    min-width: 140px;
    background: #1a1a2e;
    border: 2px solid #444;
    border-radius: 12px;
    padding: 10px 14px;
  }

  .stat-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 1.4rem;
    font-weight: 900;
    color: #ffd700;
  }

  .dignity-section { flex: 2; min-width: 200px; }

  .dignity-label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .dignity-bar-bg {
    background: #333;
    border-radius: 8px;
    height: 20px;
    overflow: hidden;
    border: 1px solid #555;
  }

  .dignity-bar-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 0.5s ease, background 0.5s ease;
  }

  .dignity-emoji {
    font-size: 1.1rem;
    margin-left: 6px;
  }

  .message-box {
    width: 100%;
    max-width: 700px;
    background: #1a1a2e;
    border: 2px solid #ffd700;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 14px;
    min-height: 54px;
    font-size: 0.95rem;
    line-height: 1.4;
    color: #f0e6d3;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .round-info {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 12px;
    text-align: center;
  }

  .choices-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    width: 100%;
    max-width: 700px;
    margin-bottom: 20px;
  }

  .choice-btn {
    background: linear-gradient(135deg, #1e1e3f, #16213e);
    border: 2px solid #444;
    border-radius: 14px;
    padding: 14px 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    color: #f0e6d3;
    font-family: 'Nunito', sans-serif;
  }

  .choice-btn:hover:not(:disabled) {
    border-color: #ffd700;
    background: linear-gradient(135deg, #2e2e5f, #26314e);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
  }

  .choice-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .choice-name {
    font-weight: 900;
    font-size: 0.95rem;
    color: #ffd700;
    margin-bottom: 4px;
  }

  .choice-desc {
    font-size: 0.78rem;
    color: #bbb;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .choice-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 0.7rem;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 700;
  }

  .tag-money { background: #1a4a1a; color: #6dff6d; border: 1px solid #4aaa4a; }
  .tag-dignity { background: #4a1a1a; color: #ff8080; border: 1px solid #aa4a4a; }

  .btn-next {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 14px 40px;
    font-size: 1rem;
    font-weight: 900;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
    margin-bottom: 16px;
  }

  .btn-next:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(255,215,0,0.4); }

  .btn-restart {
    background: linear-gradient(135deg, #8b0000, #cc0000);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px 40px;
    font-size: 1rem;
    font-weight: 900;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
    margin-bottom: 16px;
  }

  .btn-restart:hover { transform: scale(1.05); }

  .music-btn {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: #1a1a2e;
    border: 2px solid #555;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 100;
    color: #ffd700;
  }
  .music-btn:hover { border-color: #ffd700; transform: scale(1.1); }

  .music-credit {
    font-size: 0.7rem;
    color: #666;
    text-align: center;
    margin-top: -10px;
    margin-bottom: 14px;
  }

  .music-credit a { color: #888; text-decoration: none; }
  .music-credit a:hover { color: #ffd700; }

  .end-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
    max-width: 700px;
    gap: 12px;
  }

  .end-title {
    font-family: 'Bangers', cursive;
    font-size: 3rem;
    letter-spacing: 3px;
    text-shadow: 3px 3px 0 #000;
  }

  .end-title.win { color: #ffd700; }
  .end-title.lose { color: #ff4444; }

  .end-summary {
    background: #1a1a2e;
    border: 2px solid #555;
    border-radius: 14px;
    padding: 20px 28px;
    line-height: 1.8;
    font-size: 0.95rem;
  }

  .history-log {
    width: 100%;
    max-width: 700px;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px;
    font-size: 0.75rem;
    color: #888;
    max-height: 160px;
    overflow-y: auto;
    line-height: 1.7;
  }

  .log-entry { border-bottom: 1px solid #222; padding: 2px 0; }
  .log-entry:last-child { border-bottom: none; }
  .log-money { color: #6dff6d; }
  .log-dignity { color: #ff8080; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .pulsing { animation: pulse 1s infinite; }
</style>
</head>
<body>

<h1>I Lower My Dignity<br>to Increase My Bank Account</h1>
<p class="subtitle">How low will you go? 💰</p>
<p class="music-credit">🎵 <a href="https://suno.com/song/9913b15a-1999-4bc6-a792-83e9b97e10ed" target="_blank">"I Lower My Dignity" by captfunk99</a></p>

<div class="stats-bar">
  <div class="stat-box">
    <div class="stat-label">💰 Bank Account</div>
    <div class="stat-value" id="money-display">$0</div>
  </div>
  <div class="stat-box dignity-section">
    <div class="dignity-label-row">
      <div class="stat-label">🪞 Dignity Meter</div>
      <div class="stat-label" id="dignity-pct">100%</div>
    </div>
    <div class="dignity-bar-bg">
      <div class="dignity-bar-fill" id="dignity-bar" style="width:100%; background:#4CAF50;"></div>
    </div>
  </div>
  <div class="stat-box">
    <div class="stat-label">📅 Round</div>
    <div class="stat-value" id="round-display">1 / 8</div>
  </div>
</div>

<div class="message-box" id="message-box">Welcome, desperate soul. You have bills to pay and zero shame left. Choose wisely — or don't.</div>

<div class="round-info" id="round-info">Pick one action this round</div>

<div class="choices-grid" id="choices-grid"></div>

<button class="btn-next" id="btn-next" onclick="nextRound()">Next Round ▶</button>
<button class="btn-restart" id="btn-restart" onclick="restartGame()">Play Again 🔄</button>

<div class="end-screen" id="end-screen">
  <div class="end-title" id="end-title"></div>
  <div class="end-summary" id="end-summary"></div>
</div>

<div class="history-log" id="history-log"></div>

<button class="music-btn" id="music-btn" onclick="toggleMusic()" title="Toggle music">🎵</button>

<audio id="bg-music" loop>
  <source src="https://cdn1.suno.ai/9913b15a-1999-4bc6-a792-83e9b97e10ed.webm" type="audio/webm">
</audio>

<script>
const CHOICES = [
  {
    name: "Dance at a Grocery Store",
    desc: "Bust a full choreographed routine in the cereal aisle for tips. Film it. Post it.",
    money: 120,
    dignity: -8,
    reaction: "You cleared the cereal aisle. A kid gave you a quarter and called you 'the weird man.'"
  },
  {
    name: "Reply-Guy a Celebrity",
    desc: "Spend the day being the most enthusiastic commenter on a famous person's posts hoping for a follow.",
    money: 0,
    dignity: -15,
    reaction: "Zero money. Zero follow. But 4 people replied 'cringe' and now you're briefly internet-famous for the wrong reasons."
  },
  {
    name: "Eat Disgusting Food on Camera",
    desc: "Stream yourself eating a gas station sushi and a can of spray cheese. Monetize the suffering.",
    money: 380,
    dignity: -22,
    reaction: "The cheese-sushi combo broke 2,000 viewers. Your stomach is staging a revolt but the money is real."
  },
  {
    name: "Be an MLM Hype Person",
    desc: "Attend a 'business opportunity' meeting and aggressively pitch essential oils to your family.",
    money: 200,
    dignity: -30,
    reaction: "Your cousin blocked you. Your aunt bought two bottles out of pity. You're in the black, barely."
  },
  {
    name: "Freelance 'Inspirational Speaker'",
    desc: "Show up at a local business breakfast and give a 10-minute talk called 'Winning: A Journey.'",
    money: 150,
    dignity: -12,
    reaction: "Nobody asked follow-up questions. But the free muffins were excellent and they paid cash."
  },
  {
    name: "Hold a Sad Yard Sale",
    desc: "Drag your belongings to the curb and defend your prices to strangers who offer $1 for everything.",
    money: 95,
    dignity: -6,
    reaction: "Sold your old treadmill for $20. It hurts, but rent is rent."
  },
  {
    name: "Be a Human Billboard",
    desc: "Walk around downtown with a sandwich board advertising a mattress shop. Wear sunglasses so no one recognizes you.",
    money: 180,
    dignity: -18,
    reaction: "Three people took photos. One was your ex. The sunglasses did not help."
  },
  {
    name: "Peddle Bootleg Merch",
    desc: "Show up at a local concert selling knockoff t-shirts out of a duffel bag.",
    money: 320,
    dignity: -20,
    reaction: "Sold 12 shirts before security noticed. You sprinted two blocks. Worth it."
  },
  {
    name: "Pet Psychic Services",
    desc: "Advertise on Craigslist that you can communicate with pets spiritually. Charge $40 per reading.",
    money: 160,
    dignity: -25,
    reaction: "You told Mr. Whiskers was 'feeling misunderstood.' The owner cried and tipped you $20. Somehow this worked."
  },
  {
    name: "Enter a Hot Dog Eating Contest",
    desc: "Sign up for the town fair competitive eating event. The prize is $500 and a lifetime of regret.",
    money: 500,
    dignity: -35,
    reaction: "You came second. You got $200 and a plastic trophy. Also you'll never eat a hot dog again."
  },
  {
    name: "Work the Gig Economy Grind",
    desc: "Drive delivery apps, do odd jobs on TaskRabbit, and assemble IKEA furniture for strangers at 10 PM.",
    money: 260,
    dignity: -5,
    reaction: "Honest work, surprisingly. Nobody judged you. You judged yourself a little though."
  },
  {
    name: "Start a Fake GoFundMe",
    desc: "Claim your imaginary cat needs emergency surgery. Post a stock photo of a sad-looking cat.",
    money: 450,
    dignity: -50,
    reaction: "It worked. People are generous and gullible. You feel terrible. You keep the money."
  },
  {
    name: "Extreme Coupon Resale",
    desc: "Spend 6 hours at three different stores buying 40 bottles of mustard on sale, then resell them at a markup.",
    money: 70,
    dignity: -10,
    reaction: "Your car smells like mustard. You made $70. The cashier knows your face now. Not in a good way."
  },
  {
    name: "Beg for Venmo on the Street",
    desc: "Hold a sign: 'Why lie? I need money for stuff.' Include your Venmo QR code.",
    money: 85,
    dignity: -28,
    reaction: "Honesty pays. Not a lot, but hey — no lies."
  },
  {
    name: "Become a Micro-Influencer",
    desc: "Post 11 photos of 'your lifestyle' in 3 hours. Apply to every brand deal you can find, no matter how random.",
    money: 110,
    dignity: -16,
    reaction: "A kombucha brand sent you 3 free bottles and $60. You told your followers you 'partnered with them.' It's technically true."
  },
  {
    name: "Do Actual Freelance Work",
    desc: "Use your skills. Find a real client. Do the job well. Be a professional.",
    money: 400,
    dignity: 5,
    reaction: "They paid on time. You feel strangely good about yourself. This never gets old."
  }
];

const TOTAL_ROUNDS = 8;
const CHOICES_PER_ROUND = 4;

let state = {
  money: 0,
  dignity: 100,
  round: 1,
  history: [],
  chosen: false,
  musicMuted: false
};

function getDignityColor(pct) {
  if (pct > 70) return '#4CAF50';
  if (pct > 40) return '#FFC107';
  if (pct > 20) return '#FF9800';
  return '#F44336';
}

function getDignityEmoji(pct) {
  if (pct > 80) return '😇';
  if (pct > 60) return '😏';
  if (pct > 40) return '😬';
  if (pct > 20) return '😰';
  if (pct > 5) return '🫠';
  return '💀';
}

function updateStats() {
  document.getElementById('money-display').textContent = '$' + state.money.toLocaleString();
  const pct = Math.max(0, Math.min(100, state.dignity));
  document.getElementById('dignity-pct').textContent = Math.round(pct) + '%';
  const bar = document.getElementById('dignity-bar');
  bar.style.width = pct + '%';
  bar.style.background = getDignityColor(pct);
  document.getElementById('round-display').textContent = state.round + ' / ' + TOTAL_ROUNDS;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderChoices() {
  const grid = document.getElementById('choices-grid');
  grid.innerHTML = '';
  const pool = shuffleArray(CHOICES).slice(0, CHOICES_PER_ROUND);
  pool.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.dataset.index = i;
    const dignitySign = choice.dignity >= 0 ? '+' : '';
    btn.innerHTML = `
      <div class="choice-name">${choice.name}</div>
      <div class="choice-desc">${choice.desc}</div>
      <div class="choice-tags">
        <span class="tag tag-money">💰 +$${choice.money}</span>
        <span class="tag tag-dignity">🪞 ${dignitySign}${choice.dignity}%</span>
      </div>
    `;
    btn.onclick = () => makeChoice(choice, btn);
    grid.appendChild(btn);
  });
}

function makeChoice(choice, clickedBtn) {
  if (state.chosen) return;
  state.chosen = true;

  state.money += choice.money;
  state.dignity = Math.max(0, Math.min(100, state.dignity + choice.dignity));

  // Disable all buttons
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    b.style.opacity = b === clickedBtn ? '1' : '0.35';
  });
  clickedBtn.style.borderColor = '#ffd700';
  clickedBtn.style.background = 'linear-gradient(135deg, #2e2e1a, #3a3a10)';

  document.getElementById('message-box').textContent = choice.reaction;
  updateStats();

  const dignityEmoji = getDignityEmoji(state.dignity);
  state.history.push({
    round: state.round,
    name: choice.name,
    money: choice.money,
    dignity: choice.dignity,
    dignityLeft: state.dignity
  });

  addLogEntry(choice);

  if (state.dignity <= 0) {
    setTimeout(() => endGame('dignity'), 800);
    return;
  }

  if (state.round >= TOTAL_ROUNDS) {
    setTimeout(() => endGame('complete'), 800);
    return;
  }

  document.getElementById('btn-next').style.display = 'inline-block';
}

function addLogEntry(choice) {
  const log = document.getElementById('history-log');
  const dignitySign = choice.dignity >= 0 ? '+' : '';
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `Round ${state.round}: <strong>${choice.name}</strong> → <span class="log-money">+$${choice.money}</span> / <span class="log-dignity">${dignitySign}${choice.dignity}% dignity</span>`;
  log.prepend(div);
}

function nextRound() {
  state.round++;
  state.chosen = false;
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('round-info').textContent = `Round ${state.round} of ${TOTAL_ROUNDS} — pick one action`;
  document.getElementById('message-box').textContent = `Round ${state.round}. Dignity at ${Math.round(state.dignity)}%. The grind continues...`;
  updateStats();
  renderChoices();
}

function endGame(reason) {
  document.getElementById('choices-grid').innerHTML = '';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('round-info').style.display = 'none';
  document.getElementById('message-box').style.display = 'none';

  const endScreen = document.getElementById('end-screen');
  endScreen.style.display = 'flex';

  const endTitle = document.getElementById('end-title');
  const endSummary = document.getElementById('end-summary');

  if (reason === 'dignity') {
    endTitle.textContent = 'DIGNITY: ZERO';
    endTitle.className = 'end-title lose';
    endSummary.innerHTML = `
      You ran out of dignity before you ran out of rounds.<br><br>
      <strong>Final Bank Account:</strong> $${state.money.toLocaleString()}<br>
      <strong>Dignity Remaining:</strong> 0% 💀<br>
      <strong>Rounds Survived:</strong> ${state.round} / ${TOTAL_ROUNDS}<br><br>
      <em>You have the money but lost something that can't be bought back.<br>Congratulations, I guess?</em>
    `;
  } else {
    const score = state.money - (100 - state.dignity) * 5;
    let verdict = '';
    if (state.dignity > 70) verdict = 'You kept your integrity AND made money. Suspicious.';
    else if (state.dignity > 40) verdict = 'Battered but not broken. Mostly.';
    else if (state.dignity > 15) verdict = 'Your soul has seen better days but your wallet is thicc.';
    else verdict = 'You are one step from dignity zero. But rich. Was it worth it?';
    endTitle.textContent = 'GAME OVER';
    endTitle.className = 'end-title win';
    endSummary.innerHTML = `
      <strong>Final Bank Account:</strong> $${state.money.toLocaleString()} 💰<br>
      <strong>Dignity Remaining:</strong> ${Math.round(state.dignity)}% ${getDignityEmoji(state.dignity)}<br>
      <strong>Hustle Score:</strong> ${score.toLocaleString()}<br><br>
      <em>${verdict}</em>
    `;
  }

  document.getElementById('btn-restart').style.display = 'inline-block';
}

function restartGame() {
  state = { money: 0, dignity: 100, round: 1, history: [], chosen: false, musicMuted: state.musicMuted };
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('btn-restart').style.display = 'none';
  document.getElementById('round-info').style.display = 'block';
  document.getElementById('message-box').style.display = 'flex';
  document.getElementById('message-box').textContent = 'Fresh start. New you. Same bills. Let\'s go.';
  document.getElementById('round-info').textContent = 'Round 1 of 8 — pick one action';
  document.getElementById('history-log').innerHTML = '';
  updateStats();
  renderChoices();
}

function toggleMusic() {
  const audio = document.getElementById('bg-music');
  const btn = document.getElementById('music-btn');
  if (audio.paused) {
    audio.play();
    btn.textContent = '🎵';
    btn.title = 'Mute music';
  } else {
    audio.pause();
    btn.textContent = '🔇';
    btn.title = 'Play music';
  }
}

function initMusic() {
  const audio = document.getElementById('bg-music');
  audio.volume = 0.45;
  const tryPlay = () => {
    audio.play().catch(() => {});
    document.removeEventListener('click', tryPlay);
    document.removeEventListener('keydown', tryPlay);
  };
  document.addEventListener('click', tryPlay);
  document.addEventListener('keydown', tryPlay);
}

// Init
updateStats();
renderChoices();
initMusic();
</script>
</body>
</html>
