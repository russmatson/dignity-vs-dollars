  document.getElementById('money-display').textContent = '$' + state.money.toLocaleString();
  const pct = Math.max(0, Math.min(100, state.dignity));
  document.getElementById('dignity-pct').textContent = Math.round(pct) + '%';
  const bar = document.getElementById('dignity-bar');
  bar.style.width = pct + '%';
  bar.style.background = getDignityColor(pct);
  document.getElementById('round-display').textContent = state.round + ' / ' + TOTAL_ROUNDS;
  const tl = getTierLabel(pct);
  const badge = document.getElementById('tier-badge');
  badge.textContent = tl.label;
  badge.className = 'dignity-tier-badge ' + tl.cls;
}
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function renderChoices() {
  const grid = document.getElementById('choices-grid');
  grid.innerHTML = '';
  const pool = shuffleArray(CHOICES).slice(0, CHOICES_PER_ROUND);
  pool.forEach(choice => {
    const tier = getTier(state.dignity);
    const data = choice[tier];
    const dignitySign = data.dignity >= 0 ? '+' : '';
    const dignityClass = data.dignity >= 0 ? 'tag-dignity-gain' : 'tag-dignity';
    const tierHints = { high: 'You still feel this.', mid: 'Getting easier. Worryingly.', low: 'You barely blink.' };
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<div class="choice-name">${choice.name}</div>
      <div class="choice-desc">${choice.desc}</div>
      <div class="choice-tags">
        <span class="tag tag-money">💰 +$${data.money}</span>
        <span class="tag ${dignityClass}">🪞 ${dignitySign}${data.dignity}%</span>
      </div>
      <div class="tier-hint">${tierHints[tier]}</div>`;
    btn.onclick = () => makeChoice(choice, btn);
    grid.appendChild(btn);
  });
}

function getIntervention(dignity) {
  if (dignity >= 75) return null;
  // Very high chance of intervention — near-certain at low dignity
  const chance = dignity < 20 ? 0.99 : dignity < 35 ? 0.95 : dignity < 50 ? 0.88 : 0.78;
  if (Math.random() > chance) return null;
  const type = Math.random() < 0.5 ? 'church' : 'state';
  const pool = INTERVENTIONS[type];
  return { type, event: pool[Math.floor(Math.random() * pool.length)] };
}

function makeChoice(choice, clickedBtn) {
  if (state.chosen) return;
  state.chosen = true;
  const tier = getTier(state.dignity);
  const data = choice[tier];
  state.money += data.money;
  state.dignity = Math.max(0, Math.min(100, state.dignity + data.dignity));
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    b.style.opacity = b === clickedBtn ? '1' : '0.35';
  });
  clickedBtn.style.borderColor = '#ffd700';
  clickedBtn.style.background = 'linear-gradient(135deg, #2e2e1a, #3a3a10)';
  const msgBox = document.getElementById('message-box');
  msgBox.className = 'message-box';
  msgBox.textContent = data.reaction;
  state.history.push({ round: state.round, name: choice.name, tier, money: data.money, dignity: data.dignity });
  addLogEntry(choice.name, tier, data, null);
  updateStats();

  // Check for intervention
  const intervention = getIntervention(state.dignity);
  if (intervention) {
    setTimeout(() => triggerIntervention(intervention), 900);
  } else {
    checkEndOrNext();
  }
}

function triggerIntervention(intervention) {
  const { type, event } = intervention;
  state.money = Math.max(0, state.money + event.money);
  state.dignity = Math.max(0, Math.min(100, state.dignity + event.dignity));
  updateStats();

  const banner = document.getElementById('intervention-banner');
  banner.className = 'intervention-banner ' + type;
  banner.innerHTML = `${event.emoji} <strong>${event.who} HAS TAKEN NOTICE</strong>${event.money !== 0 ? ' <em>(' + (event.money > 0 ? '+' : '') + '$' + event.money + ')</em>' : ''}${event.dignity !== 0 ? ' <em>(' + (event.dignity > 0 ? '+' : '') + event.dignity + '% dignity)</em>' : ''}`;
  banner.style.display = 'block';

  const msgBox = document.getElementById('message-box');
  msgBox.className = 'message-box ' + type;
  msgBox.textContent = event.text;
  msgBox.classList.add('shake');
  setTimeout(() => msgBox.classList.remove('shake'), 600);

  addLogEntry(event.who, type, { money: event.money, dignity: event.dignity }, type);
  checkEndOrNext();
}

function checkEndOrNext() {
  if (state.dignity <= 0) { setTimeout(() => endGame('dignity'), 800); return; }
  if (state.round >= TOTAL_ROUNDS) { setTimeout(() => endGame('complete'), 800); return; }
  document.getElementById('btn-next').style.display = 'inline-block';
}

function addLogEntry(name, tier, data, interventionType) {
  const log = document.getElementById('history-log');
  const dignitySign = data.dignity >= 0 ? '+' : '';
  const moneySign = data.money >= 0 ? '+' : '';
  let colorClass = interventionType === 'church' ? 'log-church' : interventionType === 'state' ? 'log-state' : 'log-money';
  const tierColors = { high: '#6dff6d', mid: '#ffc84a', low: '#ff6060', church: '#c084fc', state: '#60a5fa' };
  const labelColor = tierColors[interventionType || tier] || '#888';
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `R${state.round}: <strong>${name}</strong> <span style="color:${labelColor};font-size:0.65rem;">[${interventionType || tier}]</span> → <span class="${colorClass}">${moneySign}$${Math.abs(data.money)}</span> / <span class="log-dignity">${dignitySign}${data.dignity}%</span>`;
  log.prepend(div);
}

function nextRound() {
  state.round++;
  state.chosen = false;
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('intervention-banner').style.display = 'none';
  const msgBox = document.getElementById('message-box');
  msgBox.className = 'message-box';
  const tl = getTierLabel(state.dignity);
  msgBox.textContent = `Round ${state.round}. Dignity: ${Math.round(state.dignity)}% (${tl.label}). Someone is watching.`;
  document.getElementById('round-info').textContent = `Round ${state.round} of ${TOTAL_ROUNDS} — pick one action`;
  updateStats();
  renderChoices();
}

function endGame(reason) {
  document.getElementById('choices-grid').innerHTML = '';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('round-info').style.display = 'none';
  document.getElementById('message-box').style.display = 'none';
  document.getElementById('intervention-banner').style.display = 'none';
  const endScreen = document.getElementById('end-screen');
  endScreen.style.display = 'flex';
  const endTitle = document.getElementById('end-title');
  const endSummary = document.getElementById('end-summary');
  if (reason === 'dignity') {
    endTitle.textContent = 'DIGNITY: ZERO';
    endTitle.className = 'end-title lose';
    endSummary.innerHTML = `You ran out of dignity before you ran out of rounds.<br><br>
      <strong>Final Bank Account:</strong> $${state.money.toLocaleString()}<br>
      <strong>Dignity Remaining:</strong> 0% 💀<br>
      <strong>Rounds Survived:</strong> ${state.round} / ${TOTAL_ROUNDS}<br><br>
      <em>Both the church and the state have you on a list. Possibly the same list.</em>`;
  } else {
    const finalTier = getTierLabel(state.dignity);
    const verdicts = {
      high: "You made money and kept your soul mostly intact. Both the church and the state found you unremarkable. This is a compliment.",
      mid: "Battered. Compromised. The pastor still prays for you. A local ordinance has your fingerprints on it. But rent is paid.",
      low: "You have the money, the hollow eyes, and a file at the city council. The Vatican has you in a spreadsheet. Well done, sort of."
    };
    endTitle.textContent = 'GAME OVER';
    endTitle.className = 'end-title win';
    endSummary.innerHTML = `<strong>Final Bank Account:</strong> $${state.money.toLocaleString()} 💰<br>
      <strong>Dignity Remaining:</strong> ${Math.round(state.dignity)}% ${getDignityEmoji(state.dignity)}<br>
      <strong>Final Status:</strong> <span style="font-weight:900">${finalTier.label}</span><br><br>
      <em>${verdicts[getTier(state.dignity)]}</em>`;
  }
  document.getElementById('btn-restart').style.display = 'inline-block';
}

function restartGame() {
  state = { money: 0, dignity: 100, round: 1, history: [], chosen: false };
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('btn-restart').style.display = 'none';
  document.getElementById('round-info').style.display = 'block';
  const msgBox = document.getElementById('message-box');
  msgBox.style.display = 'flex';
  msgBox.className = 'message-box';
  msgBox.textContent = 'Fresh start. New you. Same bills. The church hopes you do better this time.';
  document.getElementById('round-info').textContent = 'Round 1 of 8 — pick one action';
  document.getElementById('history-log').innerHTML = '';
  document.getElementById('intervention-banner').style.display = 'none';
  updateStats();
  renderChoices();
}

function toggleMusic() {
  const audio = document.getElementById('bg-music');
  const btn = document.getElementById('music-btn');
  if (audio.paused) { audio.play(); btn.textContent = '🎵'; }
  else { audio.pause(); btn.textContent = '🔇'; }
}
function initMusic() {
  const audio = document.getElementById('bg-music');
  audio.volume = 0.45;
  const tryPlay = () => { audio.play().catch(() => {}); document.removeEventListener('click', tryPlay); document.removeEventListener('keydown', tryPlay); };
  document.addEventListener('click', tryPlay);
  document.addEventListener('keydown', tryPlay);
}

updateStats();
renderChoices();
initMusic();
</script>
</body>
</html>
