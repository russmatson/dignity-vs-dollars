    desc: "Drag your belongings to the curb and defend your prices to strangers who offer $1 for everything.",

  },
  {
    name: "Human Billboard",
    desc: "Walk around downtown with a sandwich board. Wear sunglasses so no one recognizes you.",

  {

    desc: "Show up at a local concert selling knockoff t-shirts out of a duffel bag.",
    high: { money: 200, dignity: -22, reaction: "Sold 8 shirts before security noticed. You sprinted. Your heart hammered. You made money and hated yourself just enough." },
    mid:  { money: 320, dignity: -15, reaction: "You've learned where security blind spots are. You sold 14 shirts and were gone before the opener finished." },

    name: "Pet Psychic Services",

  },
  {
    name: "Gig Economy Grind",
    desc: "Drive delivery apps, do odd jobs, assemble IKEA furniture for strangers at 10 PM.",
    high: { money: 180, dignity: -5,  reaction: "Honest work. Surprisingly okay. You assembled a KALLAX at midnight and only judged yourself a normal amount." },
    mid:  { money: 260, dignity: -3,  reaction: "You're efficient now. You know the shortcuts. A customer left a 5-star review calling you 'a professional.' It helped." },

  {
    name: "Start a Fake GoFundMe",
    desc: "Claim your imaginary cat needs emergency surgery. Post a stock photo of a sad-looking cat.",
    high: { money: 300, dignity: -55, reaction: "It worked. $300 from strangers who believe in Mochi. You feel genuinely terrible. You donate $20 to a cat shelter to cope." },
    mid:  { money: 480, dignity: -40, reaction: "You added update posts. Mochi is 'doing better.' People are invested. You feel nothing now, which is new." },

  },
  {
    name: "Extreme Coupon Resale",
    desc: "Spend 6 hours at three stores buying 40 bottles of mustard on sale, then resell them at a markup.",
    high: { money: 50,  dignity: -12, reaction: "Your car smells like mustard. You made $50. The cashier memorized your face. It was not a warm look." },
    mid:  { money: 90,  dignity: -7,  reaction: "You found a rhythm. You've got a spreadsheet. The cashiers know you but you've stopped caring what they think." },
    low:  { money: 140, dignity: -2,  reaction: "You wholesale now. You have a storage unit. One guy called you 'an entrepreneur.' You're starting to agree." }
  },
  {
    name: "Beg for Venmo on the Street",
    desc: "Hold a sign: 'Why lie? I need money for stuff.' Include your Venmo QR code.",
    high: { money: 50,  dignity: -32, reaction: "A few people scanned it. You made $50. A woman who recognized you from your office said nothing and walked faster." },
    mid:  { money: 110, dignity: -20, reaction: "Honesty has a market. You refined the sign. 'Stuff includes rent' tested better. Regulars now." },
    low:  { money: 190, dignity: -8,  reaction: "You've got a corner. A following. Someone made a TikTok of your sign. You got a $50 donation from a stranger in Ohio." }
  },
  {
    name: "Become a Micro-Influencer",
    desc: "Post 11 photos of 'your lifestyle' in 3 hours. Apply to every brand deal you can find.",
    high: { money: 80,  dignity: -18, reaction: "A kombucha brand sent you 3 free bottles and $40. You told your followers you 'partnered with them.' You felt hollow." },
    mid:  { money: 150, dignity: -11, reaction: "You've learned the hashtags. A second brand deal. You know your angles. You've stopped reading your own comments." },
    low:  { money: 250, dignity: -4,  reaction: "You've optimized yourself completely. You post without thinking. Brands come to you. You are the product and that's fine." }
  },
  {
    name: "Do Actual Freelance Work",
    desc: "Use your skills. Find a real client. Do the job well. Be a professional.",
    high: { money: 350, dignity: 8,   reaction: "They paid on time. Thanked you. Said 'we'd love to work with you again.' You forgot this existed. It felt incredible." },
    mid:  { money: 400, dignity: 10,  reaction: "A clean project, fair pay, mutual respect. In context, this felt almost spiritual. You remembered who you were." },
    low:  { money: 450, dignity: 15,  reaction: "This hit differently. You did good work and got paid fairly. Something stirred in your soul. Something dormant. It's called dignity." }
  }
];

const TOTAL_ROUNDS = 8;
const CHOICES_PER_ROUND = 4;

let state = { money: 0, dignity: 100, round: 1, history: [], chosen: false };

function getTier(dignity) {
  if (dignity > 60) return 'high';
  if (dignity >= 20) return 'mid';
  return 'low';
}

function getTierLabel(dignity) {
  if (dignity > 60) return { label: 'Dignified',  cls: 'tier-high' };
  if (dignity >= 20) return { label: 'Compromised', cls: 'tier-mid' };
  return { label: 'Shameless', cls: 'tier-low' };
}

function getDignityColor(pct) {
  if (pct > 60) return '#4CAF50';
  if (pct >= 20) return '#FFC107';
  return '#F44336';
}

function getDignityEmoji(pct) {
  if (pct > 80) return '😇';
  if (pct > 60) return '😏';
  if (pct > 40) return '😬';
  if (pct > 20) return '😰';
  if (pct > 5)  return '🫠';
  return '💀';
}

function updateStats() {
  document.getElementById('money-display').textContent = '$' + state.money.toLocaleString();
  const pct = Math.max(0, Math.min(100, state.dignity));
  document.getElementById('dignity-pct').textContent = Math.round(pct) + '%';
  const bar = document.getElementById('dignity-bar');
  bar.style.width = pct + '%';
  bar.style.background = getDignityColor(pct);
  document.getElementById('round-display').textContent = state.round + ' / ' + TOTAL_ROUNDS;
  const tl = getTierLabel(pct);
  const badge = document.getElementById('tier-badge');
  badge.textContent = tl.label;
  badge.className = 'dignity-tier-badge ' + tl.cls;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderChoices() {
  const grid = document.getElementById('choices-grid');
  grid.innerHTML = '';
  const pool = shuffleArray(CHOICES).slice(0, CHOICES_PER_ROUND);
  pool.forEach(choice => {
    const tier = getTier(state.dignity);
    const data = choice[tier];
    const dignitySign = data.dignity >= 0 ? '+' : '';
    const dignityClass = data.dignity >= 0 ? 'tag-dignity-gain' : 'tag-dignity';
    const tierHints = { high: 'You still feel this.', mid: 'Getting easier. Worryingly.', low: 'You barely blink.' };
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `
      <div class="choice-name">${choice.name}</div>
      <div class="choice-desc">${choice.desc}</div>
      <div class="choice-tags">
        <span class="tag tag-money">💰 +$${data.money}</span>
        <span class="tag ${dignityClass}">🪞 ${dignitySign}${data.dignity}%</span>
      </div>
      <div class="tier-hint">${tierHints[tier]}</div>
    `;
    btn.onclick = () => makeChoice(choice, btn);
    grid.appendChild(btn);
  });
}

function makeChoice(choice, clickedBtn) {
  if (state.chosen) return;
  state.chosen = true;
  const tier = getTier(state.dignity);
  const data = choice[tier];
  state.money += data.money;
  state.dignity = Math.max(0, Math.min(100, state.dignity + data.dignity));

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    b.style.opacity = b === clickedBtn ? '1' : '0.35';
  });
  clickedBtn.style.borderColor = '#ffd700';
  clickedBtn.style.background = 'linear-gradient(135deg, #2e2e1a, #3a3a10)';

  document.getElementById('message-box').textContent = data.reaction;
  updateStats();
  state.history.push({ round: state.round, name: choice.name, tier, money: data.money, dignity: data.dignity });
  addLogEntry(choice.name, tier, data);

  if (state.dignity <= 0) { setTimeout(() => endGame('dignity'), 800); return; }
  if (state.round >= TOTAL_ROUNDS) { setTimeout(() => endGame('complete'), 800); return; }
  document.getElementById('btn-next').style.display = 'inline-block';
}

function addLogEntry(name, tier, data) {
  const log = document.getElementById('history-log');
  const dignitySign = data.dignity >= 0 ? '+' : '';
  const tierColors = { high: '#6dff6d', mid: '#ffc84a', low: '#ff6060' };
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `Round ${state.round}: <strong>${name}</strong> <span style="color:${tierColors[tier]};font-size:0.65rem;">[${tier}]</span> → <span class="log-money">+$${data.money}</span> / <span class="log-dignity">${dignitySign}${data.dignity}%</span>`;
  log.prepend(div);
}

function nextRound() {
  state.round++;
  state.chosen = false;
  document.getElementById('btn-next').style.display = 'none';
  const tierLabel = getTierLabel(state.dignity);
  document.getElementById('round-info').textContent = `Round ${state.round} of ${TOTAL_ROUNDS} — pick one action`;
  document.getElementById('message-box').textContent = `Round ${state.round}. Dignity: ${Math.round(state.dignity)}% (${tierLabel.label}). The hustle continues.`;
  updateStats();
  renderChoices();
}

function endGame(reason) {
  document.getElementById('choices-grid').innerHTML = '';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('round-info').style.display = 'none';
  document.getElementById('message-box').style.display = 'none';
  const endScreen = document.getElementById('end-screen');
  endScreen.style.display = 'flex';
  const endTitle = document.getElementById('end-title');
  const endSummary = document.getElementById('end-summary');
  if (reason === 'dignity') {
    endTitle.textContent = 'DIGNITY: ZERO';
    endTitle.className = 'end-title lose';
    endSummary.innerHTML = `
      You ran out of dignity before you ran out of rounds.<br><br>
      <strong>Final Bank Account:</strong> $${state.money.toLocaleString()}<br>
      <strong>Dignity Remaining:</strong> 0% 💀<br>
      <strong>Rounds Survived:</strong> ${state.round} / ${TOTAL_ROUNDS}<br><br>
      <em>The money is real. The you that cared is gone. These things happened in that order.</em>
    `;
  } else {
    const finalTier = getTierLabel(state.dignity);
    const verdicts = {
      high: "You made money and kept your soul mostly intact. Are you even playing correctly?",
      mid:  "Battered. Compromised. Functional. The rent is paid and the mirror is slightly harder to face.",
      low:  "You have the money and the hollow eyes of someone who has stopped counting the cost. Impressive, in its own way."
    };
    endTitle.textContent = 'GAME OVER';
    endTitle.className = 'end-title win';
    endSummary.innerHTML = `
      <strong>Final Bank Account:</strong> $${state.money.toLocaleString()} 💰<br>
      <strong>Dignity Remaining:</strong> ${Math.round(state.dignity)}% ${getDignityEmoji(state.dignity)}<br>
      <strong>Final Status:</strong> <span style="font-weight:900">${finalTier.label}</span><br><br>
      <em>${verdicts[getTier(state.dignity)]}</em>
    `;
  }
  document.getElementById('btn-restart').style.display = 'inline-block';
}

function restartGame() {
  state = { money: 0, dignity: 100, round: 1, history: [], chosen: false };
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('btn-restart').style.display = 'none';
  document.getElementById('round-info').style.display = 'block';
  document.getElementById('message-box').style.display = 'flex';
  document.getElementById('message-box').textContent = 'Fresh start. New you. Same bills. Let\'s go.';
  document.getElementById('round-info').textContent = 'Round 1 of 8 — pick one action';
  document.getElementById('history-log').innerHTML = '';
  updateStats();
  renderChoices();
}

function toggleMusic() {
  const audio = document.getElementById('bg-music');
  const btn = document.getElementById('music-btn');
  if (audio.paused) { audio.play(); btn.textContent = '🎵'; }
  else { audio.pause(); btn.textContent = '🔇'; }
}

function initMusic() {
  const audio = document.getElementById('bg-music');
  audio.volume = 0.45;
  const tryPlay = () => { audio.play().catch(() => {}); document.removeEventListener('click', tryPlay); document.removeEventListener('keydown', tryPlay); };
  document.addEventListener('click', tryPlay);
  document.addEventListener('keydown', tryPlay);
}

updateStats();
renderChoices();
initMusic();
</script>
</body>
</html>
